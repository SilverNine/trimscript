name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: ffmpeg and a speaking voice
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -q && sudo apt-get install -yq ffmpeg espeak-ng
                     espeak-ng -s 150 -w hello.wav "Hello, um, this is a quick check of the transcript editor. It runs on every push." ;;
            macOS)   brew install ffmpeg espeak-ng  # `say` on the hosted runners writes an empty file
                     espeak-ng -s 150 -w hello.wav "Hello, um, this is a quick check of the transcript editor. It runs on every push." ;;
            Windows) choco install ffmpeg -y --no-progress
                     powershell -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.SetOutputToWaveFile('hello.wav'); \$s.Speak('Hello, um, this is a quick check of the transcript editor. It runs on every push.'); \$s.Dispose()" ;;
          esac
          ffmpeg -version | head -1

      - name: unit tests
        run: uv run pytest -q

      - name: install the built wheel and run it end to end
        run: |
          uv build --wheel
          uv run --no-project python .github/smoke.py hello.wav uvx --from "$(ls dist/*.whl)" trimscript

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: the committed editor build matches web/src
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          git diff --exit-code -- ../src/trimscript/static
