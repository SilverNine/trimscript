[project]
name = "trimscript"
version = "0.0.1"
description = "Edit video by editing the transcript. Local, free, agent-friendly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/trimscript/static/THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "mcp>=2.2,<2.3",
  "noisereduce>=3.0",
  "scipy>=1.11",
  "pywhispercpp>=1.5.1,<1.6",
]

[project.optional-dependencies]
parakeet = ["parakeet-mlx>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "numpy>=1.26"]

[project.scripts]
trimscript = "trimscript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trimscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
